name: vendor-sync
# SPDX-License-Identifier: LicenseRef-Ultrastable-USL-1.0
# TENANT-SYNC-1: keeps vendor/ultrastable/ equal to the core's main, so a fix in the core reaches What Works with no person. The vendored
# vendor_sync.mjs fetches the files the core's registry maps for this tenant (public repository, no credential), the tests and the tenant
# standard run on the result, and only a green result is committed to main. The platform's tenant-repos workflow sees main move past the last
# deploy and redeploys the Worker. Written by the platform scaffold; do not edit by hand.
# budget: ~1 min per run, once a day (public repository: free minutes)
# trigger: daily (core changes reach a tenant at most daily); manual dispatch
# free-alternative: `node vendor/ultrastable/tools/vendor_sync.mjs && npm test` from a cloud-hosted agent session
on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: vendor-sync
  cancel-in-progress: false
jobs:
  sync:
    if: ${{ vars.HALT != '1' }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24}
      - name: Fetch the core's current copies
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: node vendor/ultrastable/tools/vendor_sync.mjs
      - name: Test before committing (a core change that breaks What Works stays out and turns this run red)
        run: |
          npm test
          python3 vendor/ultrastable/tools/tenantstd.py --check --tenant .
      - name: Commit to main
        run: |
          set -euo pipefail
          git add vendor/ultrastable
          if git diff --cached --quiet; then echo "vendored files already match core main"; exit 0; fi
          git config user.name "ultrastable-vendor-sync"; git config user.email "vendor-sync@users.noreply.github.com"
          git commit -m "vendor-sync: refresh core files from $(head -1 vendor/ultrastable/VENDORED_FROM) (TENANT-SYNC-1)"
          git push origin HEAD:main
      - name: Probe (red while any vendored file differs from core main)
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: node vendor/ultrastable/tools/vendor_sync.mjs --check
